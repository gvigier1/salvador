<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>miSAL</title>
<meta name="theme-color" content="#1f4fb5">
<script>document.write('<script src="config.js?v=' + Date.now() + '"><\/script>')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Salvador : bleu añil, maïs, volcan ; contours noirs, bordures en couches */
  :root {
    --c: #1f4fb5;          /* accent : bleu añil (indigo) du drapeau, ou la couleur de l'hôtel */
    --red: #e4572e;        /* orange volcan */
    --mango: #ffc93c;      /* jaune maïs */
    --ink: #141414;        /* noir des contours de mola */
    --sea: #eef3fb;        /* fond du chat */
    --muted: #4b5a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 16px/1.5 Figtree, system-ui, sans-serif; color: var(--ink); background: var(--sea); height: 100dvh; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100dvh; background: var(--sea); position: relative; }
  #bg { display: none; }
  /* sur ordinateur : le Salvador en plein écran derrière, le chat au milieu dans son cadre mola */
  @media (min-width: 860px) {
    body { background: var(--ink); }
    #bg { display: block; position: fixed; inset: 0; overflow: hidden; }
    #bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.6s; }
    #bg img.on { opacity: .9; animation: drift 14s ease-out forwards; }
    #bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(20,20,20,0) 30%, rgba(20,20,20,.55)); }
    .app { width: 540px; height: calc(100dvh - 56px); margin: 28px auto; border-radius: 26px; overflow: hidden;
           box-shadow: 0 0 0 4px var(--ink), 0 0 0 10px var(--mango), 0 0 0 14px var(--ink), 0 0 0 20px var(--red), 0 30px 60px rgba(0,0,0,.5); }
    .window, body.chatting .window { box-shadow: 0 0 0 3px var(--ink), 0 0 0 7px var(--mango), 0 0 0 10px var(--ink); margin-left: 16px; margin-right: 16px; }
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--mango); outline-offset: 2px; }

  /* ---------- bandeau ---------- */
  header { background: var(--c); color: #fff; flex: none; position: relative; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 14px 10px; }
  .av { position: relative; width: 52px; height: 52px; flex: none; }
  .av .ring { position: absolute; inset: 0; border-radius: 50%;
              background: conic-gradient(var(--red) 0 25%, var(--mango) 0 50%, var(--ink) 0 75%, #fff 0);
              animation: spin 14s linear infinite; }
  .av .pic { position: absolute; inset: 4px; border-radius: 50%; overflow: hidden; background: var(--ink);
             display: grid; place-items: center; font: 18px Bungee, sans-serif; color: var(--mango); }
  .av .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s; }
  .av .pic img.on { opacity: 1; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .who { min-width: 0; }
  .name { font: 24px/1 Bungee, sans-serif; letter-spacing: .5px; text-shadow: 2px 2px 0 var(--ink);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13px; font-weight: 600; opacity: .95; margin-top: 3px; }
  #langs { margin-left: auto; display: flex; gap: 4px; flex: none; }
  #langs button { border: 2px solid var(--ink); background: #fff; color: var(--ink); border-radius: 9px;
                  padding: 3px 7px; font-size: 12px; font-weight: 800; cursor: pointer; }
  #langs button.on { background: var(--mango); box-shadow: 2px 2px 0 var(--ink); }

  /* la fenêtre de photos, encadrée en couches de couleur */
  .window { position: relative; margin: 6px 22px 26px; height: min(34vh, 290px); border-radius: 22px; overflow: hidden;
            background: var(--ink); box-shadow: 0 0 0 4px var(--ink), 0 0 0 9px var(--mango), 0 0 0 13px var(--ink), 0 0 0 18px var(--red);
            transition: height .45s ease, margin .45s ease, box-shadow .45s; }
  .window img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
                transition: opacity 1.2s; transform: scale(1.04); }
  .window img.on { opacity: 1; animation: drift 9s ease-out forwards; }
  @keyframes drift { from { transform: scale(1.12); } to { transform: scale(1.02); } }
  .cap { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .cap span { background: rgba(20,20,20,.78); color: #fff; border-radius: 8px; padding: 3px 8px; font-size: 13px; font-weight: 600; max-width: 100%; }
  .cap a { color: #fff; opacity: .85; font-size: 10px; text-decoration: none; background: rgba(20,20,20,.6); border-radius: 6px; padding: 1px 6px; }
  .window .empty { position: absolute; inset: 0; display: grid; place-items: center; font: 40px Bungee, sans-serif; color: var(--mango); }
  body.chatting .window { height: 92px; margin: 2px 22px 24px; }
  body.chatting .cap span { display: none; }

  /* ---------- conversation ---------- */
  #chat > * { flex-shrink: 0; }          /* sinon les photos sont écrasées quand la conversation s'allonge */
  #chat { flex: 1; overflow-y: auto; padding: 18px 14px 10px; display: flex; flex-direction: column; gap: 12px; }
  .m { max-width: min(86%, 560px); padding: 10px 14px; border-radius: 18px; font-size: 15.5px; line-height: 1.5; overflow-wrap: anywhere; }
  .u { align-self: flex-end; background: var(--red); color: #fff; border-bottom-right-radius: 5px; font-weight: 600; }
  .b { align-self: flex-start; background: #fff; border: 2px solid var(--ink); border-bottom-left-radius: 5px; box-shadow: 3px 3px 0 var(--c); }
  .b a { color: var(--red); font-weight: 600; }
  .b ul { margin: 4px 0; padding-left: 20px; }
  .fb { align-self: flex-start; margin: -4px 0 0 8px; display: flex; gap: 4px; }
  .fb button { border: 0; background: none; font-size: 17px; cursor: pointer; opacity: .5; padding: 2px 4px; }
  .fb button:hover, .fb button.on { opacity: 1; transform: scale(1.15); }

  /* attente : un bus peint traverse la bulle, et une anecdote pour patienter */
  .wait { color: var(--muted); }
  .road { position: relative; height: 26px; border-bottom: 3px dashed var(--mango); margin: 0 0 8px; overflow: hidden; min-width: 210px; }
  .road i { position: absolute; bottom: -2px; font-size: 22px; font-style: normal; animation: drive 3.2s linear infinite; }
  @keyframes drive { from { left: 100%; } to { left: -30px; } }
  .fact { font-size: 14px; }
  .fact b { color: var(--ink); }
  .qpos { font-size: 13px; font-weight: 600; margin-top: 4px; }

  /* photos sous la réponse */
  .pics { align-self: flex-start; display: flex; gap: 10px; overflow-x: auto; max-width: 100%; padding: 2px 2px 6px; }
  .pics button { flex: none; width: 190px; padding: 0; border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; background: #fff; cursor: zoom-in; text-align: left; }
  .pics img { display: block; width: 100%; height: 130px; object-fit: cover; }
  .pics span { display: block; font-size: 12px; font-weight: 600; padding: 5px 8px 6px; line-height: 1.3; }

  dialog { border: 3px solid var(--ink); border-radius: 18px; padding: 0; max-width: min(94vw, 760px); box-shadow: 6px 6px 0 var(--mango); }
  dialog::backdrop { background: rgba(20,20,20,.7); }
  dialog img { display: block; width: 100%; max-height: 70vh; object-fit: contain; background: var(--ink); }
  dialog p { margin: 10px 14px 4px; font-weight: 600; }
  dialog a { display: block; margin: 0 14px 12px; font-size: 12px; color: var(--muted); }
  dialog form { position: absolute; top: 8px; right: 8px; margin: 0; }
  dialog form button { border: 2px solid var(--ink); background: #fff; border-radius: 50%; width: 36px; height: 36px; font-weight: 800; cursor: pointer; }

  /* suggestions : des autocollants */
  #chips { display: flex; gap: 10px; overflow-x: auto; padding: 4px 14px 12px; flex: none; }
  #chips button { flex: none; border: 2px solid var(--ink); background: #fff; border-radius: 999px; padding: 8px 14px;
                  font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 var(--mango); }
  #chips button:nth-child(2) { box-shadow: 3px 3px 0 var(--c); }
  #chips button:nth-child(3) { box-shadow: 3px 3px 0 var(--red); }
  #chips button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  form#f { display: flex; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 2px solid var(--ink); flex: none; }
  #q { flex: 1; min-width: 0; border: 2px solid var(--ink); border-radius: 999px; padding: 11px 16px; font: 16px Figtree, sans-serif; outline: none; }
  #q:focus { box-shadow: 3px 3px 0 var(--c); }
  #send { flex: none; border: 2px solid var(--ink); background: var(--mango); width: 48px; height: 48px; border-radius: 50%;
          font-size: 20px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  #send:disabled { opacity: .45; }
  footer { text-align: center; font-size: 11px; color: var(--muted); padding: 0 14px 8px; background: #fff; flex: none; }

  @media (prefers-reduced-motion: reduce) {
    .av .ring, .road i, .window img.on { animation: none; }
    .window, .window img, .av .pic img { transition: none; }
  }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div class="app">
<header>
  <div class="bar">
    <div class="av" aria-hidden="true"><div class="ring"></div><div class="pic" id="avpic">mi</div></div>
    <div class="who"><div class="name" id="name">miSAL</div><div class="sub" id="sub"></div></div>
    <div id="langs"><button data-l="es">ES</button><button data-l="en">EN</button><button data-l="fr">FR</button></div>
  </div>
  <figure class="window" id="win" aria-live="off"><div class="empty">SAL</div><figcaption class="cap" id="cap"></figcaption></figure>
</header>
<div id="chat" aria-live="polite"></div>
<div id="chips"></div>
<form id="f">
  <input id="q" autocomplete="off" maxlength="500" aria-label="question">
  <button id="send" aria-label="send">➤</button>
</form>
<footer id="foot"></footer>
</div>
<dialog id="zoom"><form method="dialog"><button aria-label="close">✕</button></form><img id="zimg" alt=""><p id="zcap"></p><a id="zcred" target="_blank" rel="noopener"></a></dialog>

<script>
const API = (window.MIPTY_API || "").replace(/\/$/, "");
const HOTEL = new URLSearchParams(location.search).get("h") || null;
let saved = ""; try { saved = localStorage.getItem("misal_lang") || ""; } catch (e) {}
const L = saved || (navigator.language || "es").slice(0, 2);
let lang = ["es", "en", "fr"].includes(L) ? L : "en";
let T, HOTEL_INFO = null, started = false;
const ALL = {
  es: {sub: "Tu guía de El Salvador, 24 h", ph: "Pregunta lo que quieras…", queue: n => `Hay ${n} pregunta(s) antes de la tuya`,
       know: "¿Sabías que…", slow: "Busco en mis fichas, puede tardar hasta un minuto.",
       foot: "Asistente automático de Neuralytic. La información es indicativa: confirma precios y horarios con el hotel.",
       hello: "¡Hola! Soy miSAL. Pregúntame sobre transporte, surf en El Tunco, la Ruta de las Flores, volcanes, presupuesto o seguridad en El Salvador.",
       chips: ["✈️ ¿Cómo llego del aeropuerto?", "🌋 ¿Cómo subir al volcán de Santa Ana?", "🏄 ¿Dónde aprender a surfear?"], err: "No pude conectarme. Revisa tu conexión y vuelve a intentarlo.",
       facts: ["El dólar estadounidense es la moneda de El Salvador desde 2001.",
               "A Joya de Cerén la llaman la Pompeya de América: una aldea maya cubierta de ceniza hacia el año 600.",
               "El cráter de El Boquerón mide unos 5 km de ancho y 558 m de profundidad.",
               "Con dos o tres pupusas ya tienes una comida completa.",
               "Cada 31 de agosto, en Nejapa, dos equipos se lanzan bolas de fuego en la calle principal.",
               "Los acuerdos de paz se firmaron en Chapultepec (México) el 16 de enero de 1992.",
               "La iglesia Santa Lucía de Suchitoto se construyó en 1853.",
               "El agua del Pacífico salvadoreño está a 27–29 °C todo el año.",
               "El Teatro Nacional de San Salvador es un edificio de 1917.",
               "Las «sorpresas» de Ilobasco esconden escenas diminutas dentro de una cáscara de barro.",
               "Fernando Llort creó en La Palma, en los años 70, el estilo de colores que hoy pinta sus fachadas."]},
  en: {sub: "Your El Salvador guide, 24/7", ph: "Ask me anything…", queue: n => `${n} question(s) ahead of yours`,
       know: "Did you know…", slow: "I'm checking my notes, this can take up to a minute.",
       foot: "Automated assistant by Neuralytic. Information is indicative: confirm prices and times with the hotel.",
       hello: "Hi! I'm miSAL. Ask me about getting around, surfing in El Tunco, the Ruta de las Flores, volcanoes, budget or safety in El Salvador.",
       chips: ["✈️ How do I get from the airport?", "🌋 How do I hike Santa Ana volcano?", "🏄 Where can I learn to surf?"], err: "I couldn't connect. Check your connection and try again.",
       facts: ["The US dollar has been El Salvador's currency since 2001.",
               "Joya de Cerén is called the Pompeii of the Americas: a Mayan village buried in ash around AD 600.",
               "El Boquerón crater is about 5 km wide and 558 m deep.",
               "Two or three pupusas make a full meal.",
               "Every August 31 in Nejapa, two teams throw balls of fire at each other in the main street.",
               "The peace accords were signed at Chapultepec (Mexico) on 16 January 1992.",
               "Santa Lucía church in Suchitoto was built in 1853.",
               "The Pacific off El Salvador stays at 27–29 °C all year.",
               "San Salvador's National Theater dates from 1917.",
               "Ilobasco's \"sorpresas\" hide tiny scenes inside a clay shell.",
               "In the 1970s, Fernando Llort started in La Palma the bright style that now covers its façades."]},
  fr: {sub: "Ton guide du Salvador, 24 h/24", ph: "Pose ta question…", queue: n => `${n} question(s) avant la tienne`,
       know: "Le savais-tu ?", slow: "Je cherche dans mes fiches, ça peut prendre jusqu'à une minute.",
       foot: "Assistant automatique de Neuralytic. Informations indicatives : confirme prix et horaires avec l'hôtel.",
       hello: "Salut ! Je suis miSAL. Pose-moi tes questions sur les transports, le surf à El Tunco, la Ruta de las Flores, les volcans, le budget ou la sécurité au Salvador.",
       chips: ["✈️ Comment venir de l'aéroport ?", "🌋 Comment monter au volcan de Santa Ana ?", "🏄 Où apprendre à surfer ?"], err: "Connexion impossible. Vérifie ta connexion et réessaie.",
       facts: ["Le dollar américain est la monnaie du Salvador depuis 2001.",
               "On surnomme Joya de Cerén la Pompéi des Amériques : un village maya enseveli sous la cendre vers l'an 600.",
               "Le cratère d'El Boquerón fait environ 5 km de large et 558 m de profondeur.",
               "Deux ou trois pupusas font un repas complet.",
               "Chaque 31 août à Nejapa, deux équipes se lancent des boules de feu dans la rue principale.",
               "Les accords de paix ont été signés à Chapultepec (Mexique) le 16 janvier 1992.",
               "L'église Santa Lucía de Suchitoto a été construite en 1853.",
               "Au Salvador, le Pacifique reste à 27–29 °C toute l'année.",
               "Le Théâtre national de San Salvador date de 1917.",
               "Les « sorpresas » d'Ilobasco cachent de minuscules scènes dans une coque d'argile.",
               "Dans les années 1970, Fernando Llort a lancé à La Palma le style coloré qui couvre aujourd'hui ses façades."]},
};

let session = "";
try { session = localStorage.getItem("misal_s") || ""; } catch (e) {}
if (!session) { session = Math.random().toString(36).slice(2) + Date.now().toString(36); try { localStorage.setItem("misal_s", session); } catch (e) {} }

const $ = id => document.getElementById(id);
const media = src => API + "/" + src.replace(/^\//, "");

function applyLang(l) {   // change l'interface ; le bot répond dans la langue de la question
  lang = l; T = ALL[l]; document.documentElement.lang = l;
  try { localStorage.setItem("misal_lang", l); } catch (e) {}
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  $("q").placeholder = T.ph; $("sub").textContent = T.sub;
  $("foot").textContent = (HOTEL_INFO && HOTEL_INFO.contact && HOTEL_INFO.contact[l] ? HOTEL_INFO.contact[l] + " · " : "") + T.foot;
  $("chips").innerHTML = "";
  for (const c of T.chips) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = c;
    b.onclick = () => ask(c.replace(/^\S+\s/, ""));     // l'emoji décore, la question part sans lui
    $("chips").appendChild(b);
  }
  if (!started) {
    $("chat").innerHTML = "";
    bubble("b", md((HOTEL_INFO && HOTEL_INFO.welcome && HOTEL_INFO.welcome[l]) || T.hello));
  }
  loadShow();
}
document.querySelectorAll("#langs button").forEach(b => b.onclick = () => applyLang(b.dataset.l));

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function md(s) {   // petit rendu : gras, italique, liens, listes
  const lines = esc(s).split("\n"); let out = "", inList = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\s)_(.+?)_(?=\s|$)/g, "$1<i>$2</i>")
         .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
         .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    if (/^\s*[-•]\s+/.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + l.replace(/^\s*[-•]\s+/, "") + "</li>"; }
    else { if (inList) { out += "</ul>"; inList = false; } out += l + "<br>"; }
  }
  return (out + (inList ? "</ul>" : "")).replace(/(<br>)+$/, "");
}
function scrollEnd() { $("chat").scrollTop = $("chat").scrollHeight; }
function bubble(cls, html) {
  const d = document.createElement("div"); d.className = "m " + cls; d.innerHTML = html;
  $("chat").appendChild(d); scrollEnd(); return d;
}
function feedbackRow(qa) {
  if (!qa) return;
  const r = document.createElement("div"); r.className = "fb";
  for (const [v, e] of [[1, "👍"], [-1, "👎"]]) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = e; b.setAttribute("aria-label", v > 0 ? "good" : "bad");
    b.onclick = () => { r.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on");
      fetch(API + "/api/feedback", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({qa_id: qa, value: v})}).catch(() => {}); };
    r.appendChild(b);
  }
  $("chat").appendChild(r);
}
function photoRow(photos) {
  if (!photos || !photos.length) return;
  const r = document.createElement("div"); r.className = "pics";
  for (const p of photos) {
    const b = document.createElement("button"); b.type = "button";
    b.innerHTML = `<img loading="lazy" alt="${esc(p.caption)}" src="${esc(media(p.src))}"><span>${esc(p.caption)}</span>`;
    b.onclick = () => { $("zimg").src = media(p.src); $("zimg").alt = p.caption; $("zcap").textContent = p.caption;
      $("zcred").textContent = "📷 " + p.credit + " · Wikimedia Commons"; $("zcred").href = p.page || "#"; $("zoom").showModal(); };
    r.appendChild(b);
  }
  $("chat").appendChild(r); scrollEnd();
}

// ---------- l'attente : le bus et les anecdotes ----------
let factIdx = Math.floor(Math.random() * 11);
function waitHTML(extra) {
  const f = T.facts[factIdx % T.facts.length];
  return `<div class="road"><i>🚌</i></div><div class="fact"><b>${esc(T.know)}</b> ${esc(f)}</div>` +
         `<div class="qpos">${esc(extra || T.slow)}</div>`;
}

async function ask(text) {
  text = text.trim(); if (!text) return;
  started = true; document.body.classList.add("chatting");
  $("chips").style.display = "none"; $("q").value = ""; $("send").disabled = true;
  bubble("u", esc(text));
  const w = bubble("b wait", waitHTML());
  const factTimer = setInterval(() => { factIdx++; const q = w.querySelector(".qpos"); w.innerHTML = waitHTML(q && q.textContent); }, 9000);
  try {
    const r = await fetch(API + "/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: text, session, hotel: HOTEL, lang})});
    const d = await r.json();
    if (!r.ok) { clearInterval(factTimer); w.className = "m b"; w.innerHTML = esc(d.message || T.err); $("send").disabled = false; return; }
    let first = true;
    while (true) {
      await new Promise(res => setTimeout(res, first ? 700 : 2000)); first = false;   // une réponse en mémoire arrive tout de suite
      const j = await (await fetch(API + "/api/job/" + d.job)).json();
      if (j.status === "done" || j.status === "error") {
        clearInterval(factTimer); factIdx++;
        w.className = "m b"; w.innerHTML = md(j.answer); photoRow(j.photos); feedbackRow(j.qa_id); break;
      }
      if (j.status === "queued" && j.position > 1) { const q = w.querySelector(".qpos"); if (q) q.textContent = T.queue(j.position - 1); }
      else if (j.partial) { clearInterval(factTimer); w.className = "m b"; w.innerHTML = md(j.partial); }
      scrollEnd();
    }
  } catch (e) { clearInterval(factTimer); w.className = "m b"; w.textContent = T.err; }
  $("send").disabled = false; $("q").focus();
}
$("f").onsubmit = e => { e.preventDefault(); ask($("q").value); };

// ---------- les photos qui tournent (bandeau + logo) ----------
let show = [], showIdx = 0, showTimer = null, showLang = null;
async function loadShow() {
  if (showLang === lang) return; showLang = lang;
  try {
    const d = await (await fetch(API + "/api/showcase?lang=" + lang)).json();
    show = d.photos || [];
  } catch (e) { show = []; }
  if (!show.length) return;
  $("win").querySelector(".empty")?.remove();
  clearInterval(showTimer); step();
  showTimer = setInterval(step, 6000);
}
function swap(box, src, alt) {
  const img = new Image(); img.alt = alt || ""; img.decoding = "async";
  img.onload = () => {
    box.querySelectorAll("img").forEach(x => { x.classList.remove("on"); setTimeout(() => x.remove(), 1300); });
    [...box.childNodes].forEach(n => n.nodeType === 3 && n.remove());          // les initiales cèdent la place aux photos
    box.insertBefore(img, box.querySelector("figcaption")); requestAnimationFrame(() => img.classList.add("on"));
  };
  img.src = src;
}
function step() {
  const p = show[showIdx % show.length]; showIdx++;
  swap($("win"), media(p.src), p.caption);
  $("cap").innerHTML = `<span>${esc(p.caption)}</span><a href="${esc(p.page)}" target="_blank" rel="noopener">📷 ${esc(p.credit)}</a>`;
  if (getComputedStyle($("bg")).display !== "none") swap($("bg"), media(p.src), "");
  swap($("avpic"), media(p.src), "");
}

async function start() {
  if (HOTEL) {
    try {
      const h = await (await fetch(API + "/api/hotel/" + encodeURIComponent(HOTEL))).json();
      if (h.name) {
        document.title = h.name; $("name").textContent = h.name;
        $("avpic").textContent = h.name.split(/\s+/).filter(w => /^[A-Za-zÀ-ÿ]/.test(w) && !/^(hotel|hostal|the|el|la|los|las)$/i.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join("") || h.name[0];
        document.documentElement.style.setProperty("--c", h.color || "#1f4fb5");
        document.querySelector('meta[name="theme-color"]').content = h.color || "#1f4fb5";
        HOTEL_INFO = h;
      }
    } catch (e) { console.error("miSAL: API injoignable", API, e); }
  }
  if (!API || /TON-DOMAINE|REMPLACER/.test(API)) console.error("miSAL: config.js n'a pas l'adresse du serveur", API);
  applyLang(lang);
}
start();
</script>
